services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: serviceflow
      POSTGRES_PASSWORD: integration-only
      POSTGRES_DB: serviceflow_test
    ports:
      - '5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U serviceflow -d serviceflow_test']
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 20
