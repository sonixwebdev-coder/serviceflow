<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <!-- Anvil icon -->
  <g transform="translate(4, 4)">
    <!-- Anvil body -->
    <path d="M8 28 L14 16 L38 16 L44 28 L40 28 L40 36 L36 40 L16 40 L12 36 L12 28 Z" fill="#EA580C"/>
    <!-- Anvil top (flat surface) -->
    <rect x="10" y="12" width="32" height="5" rx="1.5" fill="#C2410C"/>
    <!-- Hammer spark -->
    <circle cx="26" cy="8" r="2" fill="#F59E0B"/>
    <line x1="26" y1="2" x2="26" y2="5" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="21" y1="4" x2="23" y2="6.5" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="31" y1="4" x2="29" y2="6.5" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Anvil base -->
    <rect x="18" y="40" width="16" height="4" rx="1" fill="#9A3412"/>
  </g>
  <!-- ForjaIt text -->
  <text x="62" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#1F2937">
    Forja<tspan fill="#EA580C">It</tspan>
