<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicons — Google Search requires 48x48+ PNG; Apple needs 180x180 touch icon -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-48x48.png" type="image/png" sizes="48x48" />
    <link rel="icon" href="/favicon-192x192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EA580C" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="ServiceFlow - clientii se programeaza singuri, tu te ocupi de business. Programari online, CRM, facturare, website builder si portal clienti. 14 zile gratuit."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="http://localhost:5173/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="ServiceFlow - Clientii se programeaza singuri. Tu te ocupi de business."
    />
    <meta
      property="og:description"
      content="O singura platforma care inlocuieste agenda, Excel-ul si WhatsApp-ul. Programari, CRM, facturare, website. 14 zile gratuit."
    />
    <meta property="og:url" content="http://localhost:5173/" />
    <meta property="og:site_name" content="ServiceFlow" />
    <meta property="og:locale" content="ro_RO" />
    <meta property="og:image" content="http://localhost:5173/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="ServiceFlow - Clientii se programeaza singuri. Tu te ocupi de business."
    />
    <meta
      name="twitter:description"
      content="O singura platforma care inlocuieste agenda, Excel-ul si WhatsApp-ul. 14 zile gratuit."
    />
    <meta name="twitter:image" content="http://localhost:5173/og-image.png" />

    <title>ServiceFlow - Clientii se programeaza singuri | Programari, CRM, Facturare</title>

    <!-- Language/region — prerender-seo.js updates these per route -->
    <link rel="alternate" hreflang="ro" href="http://localhost:5173/" />
    <link rel="alternate" hreflang="x-default" href="http://localhost:5173/" />
  </head>
  <body>
    <div id="root"></div>
    <script src="/serviceflow-config.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
