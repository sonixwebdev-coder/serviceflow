x-static-healthcheck: &static-healthcheck
  test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:8080/']
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 10s

services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-serviceflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: always
    stop_grace_period: 20s
    ports:
      - '5000:5000'
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-serviceflow}
      REDIS_URL: redis://redis:6379
    volumes:
      - backend_storage:/app/apps/backend/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5000/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:5000}
        VITE_CLIENT_PORTAL_URL: ${VITE_CLIENT_PORTAL_URL:-http://localhost:5174}
        VITE_WEBSITE_BASE_URL: ${VITE_WEBSITE_BASE_URL:-http://localhost:5175}
        VITE_PLATFORM_NAME: ${PLATFORM_NAME:-ServiceFlow}
        VITE_PLATFORM_URL: ${PLATFORM_URL:-http://localhost:5173}
        VITE_PLATFORM_CONTACT_EMAIL: ${PLATFORM_CONTACT_EMAIL:-contact@example.com}
    restart: always
    environment: &serviceflow_runtime
      PLATFORM_NAME: ${PLATFORM_NAME:-ServiceFlow}
      PLATFORM_URL: ${PLATFORM_URL:-http://localhost:5173}
      PLATFORM_CONTACT_EMAIL: ${PLATFORM_CONTACT_EMAIL:-contact@example.com}
      SERVICEFLOW_API_URL: ${SERVICEFLOW_API_URL:-http://localhost:5000/api}
      SERVICEFLOW_SOCKET_URL: ${SERVICEFLOW_SOCKET_URL:-http://localhost:5000}
      SERVICEFLOW_APP_URL: ${SERVICEFLOW_APP_URL:-http://localhost:5173}
      SERVICEFLOW_PORTAL_URL: ${SERVICEFLOW_PORTAL_URL:-http://localhost:5174}
      SERVICEFLOW_WEBSITE_URL: ${SERVICEFLOW_WEBSITE_URL:-http://localhost:5175}
      SERVICEFLOW_ADMIN_URL: ${SERVICEFLOW_ADMIN_URL:-http://localhost:5176}
    ports:
      - '5173:8080'
    healthcheck: *static-healthcheck

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_PLATFORM_NAME: ${PLATFORM_NAME:-ServiceFlow}
        VITE_PLATFORM_URL: ${PLATFORM_URL:-http://localhost:5173}
        VITE_PLATFORM_CONTACT_EMAIL: ${PLATFORM_CONTACT_EMAIL:-contact@example.com}
    restart: always
    environment: *serviceflow_runtime
    ports:
      - '5176:8080'
    healthcheck: *static-healthcheck

  client-portal:
    build:
      context: .
      dockerfile: apps/client-portal/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_WS_URL: ${VITE_SOCKET_URL:-http://localhost:5000}
        VITE_FRONTEND_URL: ${VITE_FRONTEND_URL:-http://localhost:5173}
        VITE_WEBSITE_BASE_URL: ${VITE_WEBSITE_BASE_URL:-http://localhost:5175}
        VITE_PLATFORM_NAME: ${PLATFORM_NAME:-ServiceFlow}
        VITE_PLATFORM_URL: ${PLATFORM_URL:-http://localhost:5173}
        VITE_PLATFORM_CONTACT_EMAIL: ${PLATFORM_CONTACT_EMAIL:-contact@example.com}
    restart: always
    environment: *serviceflow_runtime
    ports:
      - '5174:8080'
    healthcheck: *static-healthcheck

  website:
    build:
      context: .
      dockerfile: apps/website/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_PLATFORM_NAME: ${PLATFORM_NAME:-ServiceFlow}
        VITE_PLATFORM_URL: ${PLATFORM_URL:-http://localhost:5173}
        VITE_PLATFORM_CONTACT_EMAIL: ${PLATFORM_CONTACT_EMAIL:-contact@example.com}
    restart: always
    environment: *serviceflow_runtime
    ports:
      - '5175:8080'
    healthcheck: *static-healthcheck

volumes:
  pgdata:
  redisdata:
  backend_storage:
