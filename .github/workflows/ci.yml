name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace apps/frontend
      - run: npm run lint --workspace apps/client-portal
      # apps/admin has no lint script — skip
      # apps/website is not in workspaces — lint separately
      - run: cd apps/website && npm ci && npm run lint

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/testdb
      JWT_ACCESS_SECRET: ci-test-access-secret-min16
      JWT_REFRESH_SECRET: ci-test-refresh-secret-min16
      CSRF_SECRET: ci-test-csrf-secret-min16
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy --schema prisma/schema.prisma
      - run: npm test --workspace apps/backend

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace apps/frontend
      - run: npm run build --workspace apps/client-portal
      - run: npm run build --workspace apps/admin
      # apps/website is not in root workspaces
      - run: cd apps/website && npm ci && npm run build

  security:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high || true
      # Check for leaked secrets in source code
      - name: Check for leaked secrets
        run: |
          if grep -rn 'sk_live_\|pk_live_\|whsec_live' --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' --include='*.json' . \
            --exclude-dir=node_modules --exclude-dir=.git; then
            echo "::error::Potential production secrets found in source code!"
            exit 1
          fi
